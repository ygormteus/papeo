name: Autoteste

# Testes no app de verdade (WebKit no Mac, WebView2 no Windows): links das
# contas, prévia de links e permissões das interfaces. Roda antes dos builds
# de cada versão (chamado pelo `release.yml`) ou sob demanda.
on:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  selftest:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      # Arquivos com fim de linha "\n" também no Windows (os testes leem fontes).
      - run: git config --global core.autocrlf false
      # Actions fixadas por SHA de commit (a tag ao lado é só referência).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo test -p papeo-core
      - run: cargo test -p papeo --lib
      - run: cargo clippy -p papeo --all-targets -- -D warnings
      # Abre o app com dados temporários e uma conta de teste num servidor
      # local; sai com erro se algum caso falhar.
      - name: Autoteste no app
        timeout-minutes: 10
        run: cargo run -p papeo --features selftest
