name: Build

# Roda só sob demanda ou ao criar uma tag v*, para não gastar minutos de
# runner macOS/Windows a cada push enquanto o repositório for privado.
#
# Tag v*: cria um release em rascunho, os 3 builds enviam para ele (com os
# pacotes de atualização e o `latest.json`) e um último job confere se o
# `latest.json` tem as 3 plataformas. Execução manual: só gera os instaladores
# como artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Sem permissões por padrão; cada job pede só o que usa.
permissions: {}

jobs:
  # Um único job cria o rascunho, para os builds em paralelo não criarem
  # releases duplicados.
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      # Sem as notas desta versão o release não sai: confere antes dos builds.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: release-notes
          sparse-checkout-cone-mode: false
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          notes="release-notes/${TAG#v}.md"
          test -s "$notes" || { echo "::error::falta $notes com as notas desta versão (o que mudou, para quem usa)"; exit 1; }
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # Reexecutar o workflow reaproveita o rascunho desta tag.
          ids=$(gh api --paginate "repos/$REPO/releases" --jq '.[] | select(.draft and .tag_name == env.TAG) | .id')
          id=${ids%%$'\n'*}
          if [ -z "$id" ]; then
            id=$(gh api "repos/$REPO/releases" -f tag_name="$TAG" -f name="Papeo $TAG" -F draft=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    permissions:
      contents: write # enviar os arquivos ao rascunho
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      # Actions fixadas por SHA de commit (a tag ao lado é só referência).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
      # Cache só nas execuções manuais: o build de release parte do zero.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - run: cargo test -p papeo-core
      # macOS: assinatura ad-hoc (`signingIdentity: "-"` em tauri.conf.json),
      # sem conta Apple Developer. Windows: sem assinatura por enquanto.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assina os pacotes de atualização (`latest.json`); a chave pública
          # está em `plugins.updater.pubkey` de tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Vazio na execução manual: só gera os arquivos, sem release.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Só NSIS no Windows (`bundle.targets`); sem MSI, a atualização não
          # mistura instalação por usuário com instalação por máquina.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: papeo-${{ matrix.platform }}-${{ matrix.rust_targets || 'x64' }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app.tar.gz
            target/**/release/bundle/nsis/*.exe

  # Os builds atualizam o mesmo `latest.json` em paralelo; sem uma das
  # plataformas, ela nunca recebe atualização. Confira antes de publicar.
  check-updater-json:
    needs: [create-release, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # ler e atualizar os arquivos de um rascunho
    steps:
      # Só as notas de versão e o modelo do texto do release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            release-notes
            .github/release-template.md
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: |
          # Falha da API para o job (não vira "arquivo não existe").
          id_of() {
            local ids
            ids=$(gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets" \
              --jq ".[] | select(.name == \"$1\") | .id") || return 1
            echo "${ids%%$'\n'*}"
          }
          rename() { gh api -X PATCH "repos/$REPO/releases/assets/$1" -f name="$2" --jq .name; }
          # Uma execução anterior interrompida no meio da troca: desfaz.
          old=$(id_of latest.old.json)
          cur=$(id_of latest.json)
          if [ -z "$cur" ] && [ -n "$old" ]; then rename "$old" latest.json; fi
          for leftover in latest.next.json latest.old.json; do
            id=$(id_of "$leftover")
            if [ -n "$id" ]; then gh api -X DELETE "repos/$REPO/releases/assets/$id"; fi
          done

          asset=$(id_of latest.json)
          test -n "$asset" || { echo "::error::latest.json não foi enviado ao rascunho"; exit 1; }
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$asset" > latest.json
          for p in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].url and .platforms[$p].signature' latest.json > /dev/null \
              || { echo "::error::latest.json sem a plataforma $p"; exit 1; }
          done
          jq '.version, (.platforms | keys)' latest.json

          # "O que mudou": as notas da versão vão para o `latest.json` (o app
          # mostra antes de atualizar) e para o texto do release.
          version=$(jq -r .version latest.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::versão inválida: $version"; exit 1; }
          test "v$version" = "$TAG" || { echo "::error::latest.json é da versão $version, a tag é $TAG"; exit 1; }
          notes="release-notes/$version.md"
          test -s "$notes" || { echo "::error::falta $notes com as notas desta versão"; exit 1; }
          jq --rawfile notes "$notes" '.notes = $notes' latest.json > latest.new.json
          # Troca sem nunca ficar sem `latest.json`: envia o novo com outro
          # nome, renomeia o antigo, dá o nome certo ao novo e só então apaga
          # o antigo. Se a troca falhar, o antigo volta.
          next=$(gh api -X POST -H "Content-Type: application/json" --input latest.new.json \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=latest.next.json" --jq .id)
          rename "$asset" latest.old.json
          if rename "$next" latest.json; then
            gh api -X DELETE "repos/$REPO/releases/assets/$asset"
          else
            rename "$asset" latest.json
            echo "::error::não consegui gravar as notas no latest.json"
            exit 1
          fi
          { cat "$notes"; sed "s/{{VERSION}}/$version/g" .github/release-template.md; } > body.md
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -F body=@body.md --jq .html_url

  # Prova de que os arquivos saíram deste repositório e deste workflow
  # (`gh attestation verify`). Só este job tem permissão de emitir a
  # atestação, e só roda com o repositório público.
  attest:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-artifacts
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.app.tar.gz
            dist-artifacts/**/*.exe
