[package]
name = "papeo"
version = "0.12.0"
authors = ["Ygor Moura"]
description = "Mensageiros num só lugar, leve e rápido"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[lib]
name = "papeo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Autoteste no app de verdade (CI e conferência local); fora do app publicado.
selftest = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-opener = "2.7"
tauri-plugin-notification = "2.8"
tauri-plugin-dialog = "2.8"
tauri-plugin-autostart = "2.7"
# TLS do sistema (SChannel no Windows, Security.framework no macOS).
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
papeo-core = { path = "../crates/papeo-core" }
# Sincronização pelo Google Drive (o mesmo reqwest do atualizador).
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query", "system-proxy"] }
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.21"
url = "2"
# Avisos de e-mail por IMAP (o mesmo TLS do sistema que o reqwest usa).
native-tls = "0.2"
# Envio de e-mail (SMTP com TLS do sistema; também monta a mensagem).
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls", "hostname"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
security-framework = "3"
libc = "0.2"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSData", "NSArray", "NSSet", "NSBundle", "NSURL", "NSGeometry"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationCategory", "UNNotificationAction", "UNNotificationSound", "UNNotification", "UNNotificationTrigger", "UNNotificationSettings"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_SystemInformation", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Foundation", "Foundation_Collections", "Data_Xml_Dom", "UI_Notifications"] }
windows-future = "0.3"
