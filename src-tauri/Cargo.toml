[package]
name = "papeo"
version = "0.1.0"
description = "Mensageiros num só lugar, leve e rápido"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "papeo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
papeo-core = { path = "../crates/papeo-core" }
